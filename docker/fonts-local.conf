<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- cairosvg picks a font by family name only (no per-glyph fallback), so map the
     families HTML/SVG diagrams commonly name, plus the generic ones, to a Korean font. -->
<fontconfig>
  <alias binding="same"><family>Apple SD Gothic Neo</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Noto Sans KR</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>sans-serif</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>NanumGothic</family></prefer></alias>
</fontconfig>
