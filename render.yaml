# Docker API for EDU-TMS — set TEMPLATE_PPTX after deploy
# docs/DEPLOY-TMS-RENDER.md

services:
  - type: web
    name: ppt-academizer-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PPT_ACADEMIZER_SKIP_PP_REPAIR
        value: "1"
      - key: PPT_ACADEMIZER_CORS_ORIGINS
        value: "https://edu-team-tms-ten.vercel.app,http://localhost:3000,http://127.0.0.1:3000"
      - key: TEMPLATE_PPTX
        sync: false
