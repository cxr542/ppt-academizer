# Optional API host for Netlify UI — https://render.com
# After deploy, set Netlify env PPT_ACADEMIZER_API_URL=https://<service>.onrender.com

services:
  - type: web
    name: ppt-academizer-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PPT_ACADEMIZER_SKIP_PP_REPAIR
        value: "1"
      - key: PPT_ACADEMIZER_CORS_ORIGINS
        sync: false
      - key: TEMPLATE_PPTX
        sync: false
